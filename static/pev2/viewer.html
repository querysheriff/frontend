<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Explain plan</title>
		<!-- Sandboxed to an opaque origin (pev2 renders unparsable plan text as HTML), and every CDN file is pinned. -->
		<link
			href="https://unpkg.com/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
			rel="stylesheet"
		/>
		<link
			href="https://unpkg.com/pev2@1.24.0/dist/pev2.css"
			integrity="sha384-ruZWBryuZaHNxIVh+I4QrApHxY6evVTwwFqvDYscMkwhzIDnUjkJM9aRJPRYRpm+"
			crossorigin="anonymous"
			rel="stylesheet"
		/>
	</head>
	<body>
		<script>
			// The sandbox denies real localStorage, which pev2 reads unguarded for its view options.
			const memory = new Map();
			Object.defineProperty(window, 'localStorage', {
				configurable: true,
				value: {
					getItem: (key) => memory.get(key) ?? null,
					setItem: (key, value) => memory.set(key, String(value)),
					removeItem: (key) => memory.delete(key)
				}
			});
		</script>
		<div id="app" class="d-flex flex-column vh-100">
			<pev2 v-if="plan" :plan-source="plan" :plan-query="query" />
		</div>

		<script
			src="https://unpkg.com/vue@3.5.43/dist/vue.global.prod.js"
			integrity="sha384-EAm39cvdifYiZjQQxCxStLasDodQMYokBrN5XPuJ7aC/JsQ4vyEUCy/+6hXpcBOW"
			crossorigin="anonymous"
		></script>
		<script
			src="https://unpkg.com/pev2@1.24.0/dist/pev2.umd.js"
			integrity="sha384-kADkqUSXD1ppac6SxudqP7hclv3cTXXpQugfOvQymBt6poJuI9xPa37vPO/ZdPoA"
			crossorigin="anonymous"
		></script>
		<script>
			const { createApp } = Vue;
			const app = createApp({
				data() {
					return { plan: '', query: '' };
				}
			});
			app.component('pev2', pev2.Plan);
			const vm = app.mount('#app');

			// The sandboxed frame has an opaque origin, so trust the sender window, not an origin.
			window.addEventListener('message', (event) => {
				if (event.source !== window.parent) return;
				if (event.data?.type !== 'pev2:plan') return;
				vm.plan = event.data.planJson ?? '';
				vm.query = event.data.query ?? '';
			});
		</script>
	</body>
</html>
